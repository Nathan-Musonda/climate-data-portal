{% extends "base.html" %}

{% block title %}Error - Zambia Climate Portal{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 720px;">
        <div class="card-body p-4 p-md-5 text-center">
            <div class="display-4 fw-bold text-danger mb-3">{{ error_code or 500 }}</div>
            <h1 class="h3 mb-3">Something went wrong</h1>
            <p class="text-muted mb-4">{{ error_message or "An unexpected error occurred while loading this page." }}</p>
            <a href="/overview" class="btn btn-primary">Return to Overview</a>
        </div>
    </div>
</section>
{% endblock %}
